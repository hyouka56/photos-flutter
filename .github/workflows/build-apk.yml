name: Build Photos APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name photos --org com.hyouka

      - name: Configure offline photo access and launcher icon
        run: python3 tool/configure_android.py

      - name: Format Dart source
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Get dependencies
        run: flutter pub get

      # Keep the exact resolved versions available briefly for dependency security audits.
      - name: Upload resolved Pub lockfile for audits
        uses: actions/upload-artifact@v6
        with:
          name: photos-pub-dependency-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Verify manifest, icon, and privacy
        run: |
          set -euo pipefail
          grep -q 'android:label="Photos"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/photos_icon"' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE=android/app/build.gradle.kts
            grep -Fq 'abiFilters += listOf("arm64-v8a")' "$GRADLE_FILE"
          elif [ -f android/app/build.gradle ]; then
            GRADLE_FILE=android/app/build.gradle
            grep -Fq 'abiFilters "arm64-v8a"' "$GRADLE_FILE"
          else
            echo 'Android Gradle file not found.'
            exit 1
          fi
          grep -Fq 'lib/armeabi-v7a/**' "$GRADLE_FILE"
          grep -Fq 'lib/x86/**' "$GRADLE_FILE"
          grep -Fq 'lib/x86_64/**' "$GRADLE_FILE"
          grep -q 'android.permission.READ_MEDIA_IMAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_MEDIA_VIDEO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_MEDIA_VISUAL_USER_SELECTED' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/photos_icon.xml
          test -f android/app/src/main/res/drawable/launch_background.xml
          grep -Fq '#FF000000' android/app/src/main/res/drawable/launch_background.xml
          if [ -f android/app/src/main/res/values-v31/styles.xml ]; then
            grep -Fq 'android:windowSplashScreenBackground' android/app/src/main/res/values-v31/styles.xml
            grep -Fq '#FF000000' android/app/src/main/res/values-v31/styles.xml
          fi
          grep -q 'android:fillColor="#000000"' android/app/src/main/res/drawable/photos_icon.xml
          grep -q 'android:fillColor="#FFFFFF"' android/app/src/main/res/drawable/photos_icon.xml
          test -f android/app/src/main/kotlin/com/hyouka/photos/MainActivity.kt
          grep -Fq 'MediaStore.createDeleteRequest' android/app/src/main/kotlin/com/hyouka/photos/MainActivity.kt
          grep -Fq 'photos/permanent_delete' lib/photo_library.dart
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/res/drawable/photos_icon.xml')"
          if grep -R 'android.permission.INTERNET' android/app/src/main; then
            echo 'Internet permission found; this app is designed to work only with on-device photos.'
            exit 1
          fi

      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK architecture
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one release APK in $APK_DIR; found $APK_COUNT."
            find "$APK_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          echo "Verified APK path: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          unzip -l "$APK" > apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          if grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/' apk-contents.txt; then
            echo 'Unexpected non-arm64 ABI in APK.'
            grep -E 'lib/(armeabi-v7a|x86|x86_64)/' apk-contents.txt
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: photos-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
